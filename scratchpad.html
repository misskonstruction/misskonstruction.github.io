<!DOCTYPE html><html lang=en><head><meta charset=utf-8><meta name="robots" content="noindex, nofollow"><meta name=viewport content="width=device-width,initial-scale=1"><title>ScratchPad v2.4</title><style>:root{--a:#2ca01c;--bg1:#0b0b0b;--bg2:#121212;--pbg:#202020cc;--t:#fff;--m:rgb(230,230,230,.7)}[data-theme=light]{--bg1:#f6f7fb;--bg2:#eef1f7;--pbg:#ffffffdd;--t:#000;--m:rgb(40,40,40,.65)}*{box-sizing:border-box;transition:background .35s ease,color .35s ease,border-color .35s ease}body{margin:0;min-height:100vh;display:grid;align-content:start;justify-items:center;gap:.5rem;padding:2vh 5vh 6vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));font-family:system-ui,sans-serif;color:var(--t)}h1{margin:12px 0 4px;font:700 1.2rem/1.3 ui-monospace,monospace;color:var(--t);text-shadow:0 0 8px var(--a)}p.instructions{margin:0 0 6px;color:var(--m);font:.9rem/1.3 system-ui,sans-serif}p.credit{margin:0 0 1rem;color:var(--m);font:.8rem/1.2 system-ui,sans-serif}.toolbar{width:min(80rem,95vw);display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;margin-bottom:1rem}.counter{font:.8rem/1.2 system-ui,sans-serif;color:var(--m)}.btn{cursor:pointer;border-radius:10px;border:1px solid var(--a);background:rgb(255,255,255,.08);color:var(--t);box-shadow:0 8px 18px #0008;padding:.5rem .8rem;backdrop-filter:blur(10px);transition:all .25s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 0 12px var(--a)}.btn:active{transform:scale(.96);box-shadow:0 0 8px var(--a)}.color{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--a);background:rgb(255,255,255,.08);padding:.25rem .5rem;border-radius:10px;backdrop-filter:blur(10px)}.color input{width:32px;height:24px;border:1px solid var(--a);border-radius:6px;padding:0;background:none}#pad{font:1.05rem/1.55 ui-monospace,monospace;width:min(80rem,95vw);min-height:65vh;max-height:80vh;overflow:auto;white-space:pre-wrap;word-wrap:break-word;padding:1.75rem;color:var(--t);background:var(--pbg);border:2px solid var(--a);border-radius:18px;backdrop-filter:blur(16px);box-shadow:0 20px 50px #00006a33;caret-color:var(--a);transition:all .35s ease}#pad *{color:inherit!important;background:transparent!important;font:inherit!important}.toast{position:fixed;left:50%;top:10px;transform:translateX(-50%) scale(.98);opacity:0;padding:.4rem .8rem;border-radius:8px;background:var(--a)33;color:var(--t);border:1px solid var(--a);backdrop-filter:blur(8px);transition:opacity .18s ease,transform .18s ease}.toast.show{opacity:1;transform:translateX(-50%) scale(1)}</style></head><body data-theme=dark><h1>ScratchPad v2.4</h1><p class=instructions>Copy • Clear • Accent • Theme</p><p class=credit>Made by Charles R.</p><div class=toolbar><div class=color><label for=ac>Accent</label><input type=color id=ac value="#2ca01c"></div><div class=counter id=counter>0 chars | 0 words</div><div class=actions><button class=btn id=theme>Toggle Theme</button><button class=btn id=copy>Copy</button><button class=btn id=clear>Clear</button></div></div><div id=pad contenteditable spellcheck=false autocapitalize=off autocomplete=off autocorrect=off></div><div class=toast id=toast>Copied</div><script>(()=>{const D=document,B=document.body,R=document.documentElement,$=id=>D.getElementById(id);const pad=$('pad'),copy=$('copy'),clear=$('clear'),toast=$('toast'),ac=$('ac'),theme=$('theme'),counter=$('counter');function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100)}function setAccent(v){R.style.setProperty('--a',v)}function applyTheme(t){B.setAttribute('data-theme',t)}function fallbackCopy(text){const ta=D.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-9999px';D.body.appendChild(ta);ta.select();let ok=!1;try{ok=D.execCommand?D.execCommand('copy'):!1}catch(e){}D.body.removeChild(ta);if(ok)toastMsg('Copied');else{const r=D.createRange();r.selectNodeContents(pad);const s=window.getSelection();s.removeAllRanges();s.addRange(r);toastMsg('Press Ctrl/Cmd+C')}}function doCopy(){const text=pad.innerText.replace(/\u00A0/g,' ');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toastMsg('Copied')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function updateCounter(){const t=pad.innerText.trim();const chars=t.length;const words=t?t.split(/\s+/g).filter(x=>x).length:0;counter.textContent=`${chars} chars | ${words} words`}copy.onclick=doCopy;clear.onclick=()=>{if(!pad.textContent.trim()||confirm('Clear the scratchpad?')){pad.innerHTML='';toastMsg('Cleared');pad.focus();updateCounter()}};theme.onclick=()=>applyTheme(B.getAttribute('data-theme')==='dark'?'light':'dark');ac.oninput=e=>setAccent(e.target.value);pad.addEventListener('paste',e=>{e.preventDefault();let t='';if(e.clipboardData&&e.clipboardData.getData)t=e.clipboardData.getData('text/plain');else if(window.clipboardData&&window.clipboardData.getData)t=window.clipboardData.getData('Text');t=t.replace(/\r\n/g,'\n');document.execCommand('insertText',!1,t)});pad.addEventListener('input',updateCounter);window.onload=()=>pad.focus()})();</script></body></html>
