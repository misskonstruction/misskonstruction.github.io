name: Mirror to misskonstruction.github.io

# Mirrors every push on this repo to the original
# misskonstruction/misskonstruction.github.io repo so GitHub Pages keeps
# deploying from the original URL even though Lovable now syncs to a
# different repo.
#
# REQUIRED ONE-TIME SETUP (in this repo's GitHub settings):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  MIRROR_PAT
#     Value: a GitHub Personal Access Token with `repo` scope (classic)
#            OR a fine-grained PAT with Contents: Read and write on
#            misskonstruction/misskonstruction.github.io
#
# After the secret is added, every push to main here will force-push the
# same commits to misskonstruction.github.io (branch: main), which will
# trigger that repo's Pages deploy as before.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to misskonstruction.github.io
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "::error::MIRROR_PAT secret is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          git remote add mirror "https://x-access-token:${MIRROR_PAT}@github.com/misskonstruction/misskonstruction.github.io.git"
          # Force-push current branch to the same branch name on the mirror.
          git push mirror "HEAD:refs/heads/${GITHUB_REF_NAME}" --force
