name: Deploy to GitHub Pages
# Trigger redeploy: preserve custom domain after 404 report


# Builds the TanStack Start app, prerenders every route to static HTML,
# and publishes the result to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build app
        run: bun run build

      - name: Add TanStack preview server compatibility shim
        run: |
          if [ ! -f dist/server/server.js ]; then
            for f in dist/server/index.js dist/server/index.mjs dist/server/server.mjs; do
              if [ -f "$f" ]; then cp "$f" dist/server/server.js; break; fi
            done
          fi

      - name: Prerender static HTML
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WORDPRESS_COM_API_KEY: ${{ secrets.WORDPRESS_COM_API_KEY }}
        run: bun run prerender

      - name: Add SPA fallback + custom domain + .nojekyll
        run: |
          # GitHub Pages 404 fallback so deep links work
          cp dist-static/index.html dist-static/404.html
          printf '%s\n' "misskonstruction.com" > dist-static/CNAME
          touch dist-static/.nojekyll
          test -s dist-static/404.html
          test "$(cat dist-static/CNAME)" = "misskonstruction.com"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - id: deployment
        uses: actions/deploy-pages@v4
