name: Deploy to GitHub Pages
# Stable deploy: keep the committed static site published for misskonstruction.github.io.
# No server build, no prerender, no CNAME, no repo-settings API calls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          test -s dist-static/index.html

          # The root of this user-site repo also contains the same static files,
          # so GitHub Pages works even when the repository is configured as main/root.
          test -s index.html
          test -d assets

          # Keep the default GitHub Pages URL working: misskonstruction.github.io
          rm -f CNAME
          rm -f dist-static/CNAME

          # GitHub Pages SPA fallback: encode requested path into a query
          # string and bounce to '/'. index.html's restore script (injected
          # below) puts the real URL back before the SPA boots, so shared
          # deep links (e.g. individual blog posts) render the right page
          # instead of falling back to the home page.
          cat > dist-static/404.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting…</title>
          <script>
            var l = window.location;
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
              (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
              l.hash
            );
          </script></head><body></body></html>
          HTML

          # Inject URL-restore script into index.html once (idempotent).
          if ! grep -q 'spa-github-pages-restore' dist-static/index.html; then
            python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('dist-static/index.html')
          html = p.read_text()
          snippet = '<script id="spa-github-pages-restore">(function(l){if(l.search[1]==="/"){var d=l.search.slice(1).split("&").map(function(s){return s.replace(/~and~/g,"&")}).join("?");window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);}}(window.location))</script>'
          html = re.sub(r'<head([^>]*)>', r'<head\1>' + snippet, html, count=1)
          p.write_text(html)
          PY
          fi

          touch dist-static/.nojekyll
          test -s dist-static/404.html
          find dist-static -type f -name '.DS_Store' -delete
          echo "root files ready: $(test -s index.html && echo yes)"
          echo "dist-static files ready: $(find dist-static -type f | wc -l)"
          echo "deployment source: committed static files"
          echo "✅ 404.html and .nojekyll are in place"

      - name: Publish static files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          publish_branch: gh-pages
          force_orphan: true
