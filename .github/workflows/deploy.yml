name: Deploy to GitHub Pages
# Build from source on every push, then publish the static output to gh-pages.
# The committed dist-static/ and root static files stay as a safety net:
# if the build fails, the last-known-good static site can still be published
# by re-running the workflow manually against the previous commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build client + server bundle
        run: bun run build

      - name: Prerender static routes (non-fatal on failure)
        run: |
          set +e
          bun run prerender
          PRERENDER_EXIT=$?
          echo "prerender exit: $PRERENDER_EXIT"
          # Only fall back if prerender itself failed. Do NOT gate on
          # dist-static/index.html here — a successful prerender is the source
          # of truth and must not be wiped out by the fallback branch.
          if [ "$PRERENDER_EXIT" -ne 0 ]; then
            echo "⚠️  prerender failed — falling back to client build"
            rm -rf dist-static
            mkdir -p dist-static
            if [ -d .output/public ]; then cp -r .output/public/. dist-static/;
            elif [ -d dist/client ]; then cp -r dist/client/. dist-static/;
            else echo "❌ no client build output found"; exit 1; fi
          fi
          test -s dist-static/index.html
          # SPA fallback: copy index.html to 404.html as last resort
          cp dist-static/index.html dist-static/404.html

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          test -s dist-static/index.html

          # Never publish a CNAME (project lives at the default github.io URL).
          rm -f CNAME dist-static/CNAME

          # SPA redirect: encode requested path into query string and bounce
          # to '/'. index.html's restore script (injected below) puts the real
          # URL back before the SPA hydrates, so deep links resolve.
          cat > dist-static/404.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting…</title>
          <script>
            var l = window.location;
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
              (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
              l.hash
            );
          </script></head><body></body></html>
          HTML

          # Inject restore script into every index.html (idempotent).
          python3 - <<'PY'
          import pathlib, re
          snippet = '<script id="spa-github-pages-restore">(function(l){if(l.search[1]==="/"){var d=l.search.slice(1).split("&").map(function(s){return s.replace(/~and~/g,"&")}).join("?");window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);}}(window.location))</script>'
          count = 0
          for p in pathlib.Path("dist-static").rglob("index.html"):
              html = p.read_text()
              if "spa-github-pages-restore" in html:
                  continue
              html = re.sub(r'<head([^>]*)>', r'<head\1>' + snippet, html, count=1)
              p.write_text(html)
              count += 1
          print(f"injected into {count} files")
          PY

          touch dist-static/.nojekyll
          find dist-static -type f -name '.DS_Store' -delete
          echo "✅ dist-static ready: $(find dist-static -type f | wc -l) files"

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          publish_branch: gh-pages
          force_orphan: true
