name: Deploy to GitHub Pages
# Stable deploy: publish the checked-in static site only.
# No server build, no prerender, no CNAME, no repo-settings API calls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          test -s dist-static/index.html

          # Keep the default GitHub Pages URL working: misskonstruction.github.io
          rm -f dist-static/CNAME

          # GitHub Pages SPA fallback so direct visits to nested routes work.
          if [ -f dist-static/index.html ]; then
            cp dist-static/index.html dist-static/404.html
          fi

          touch dist-static/.nojekyll
          test -s dist-static/404.html
          find dist-static -type f -name '.DS_Store' -delete
          echo "dist-static files ready: $(find dist-static -type f | wc -l)"
          echo "✅ 404.html and .nojekyll are in place"

      - name: Publish static files to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          publish_branch: gh-pages
          force_orphan: true
          cname: ""
