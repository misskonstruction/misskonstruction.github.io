name: Deploy to GitHub Pages
# Trigger redeploy: default GitHub Pages URL, no CNAME, static SPA fallback

# Builds the app, publishes only the static client files to GitHub Pages,
# and uses 404.html as the deep-link fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build app
        run: |
          rm -rf dist dist-static .output
          rm -rf dist-static
          bun run build

      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          rm -rf dist-static
          mkdir -p dist-static
          for d in dist/client .output/public dist .vinxi/build/client; do
            if [ -f "$d/index.html" ]; then
              echo "Using static client files from $d"
              cp -r "$d"/. dist-static/
              break
            fi
          done
          if [ -d public ]; then cp -r public/. dist-static/; fi
          # GitHub Pages SPA fallback so direct visits to nested routes work.
          if [ -f dist-static/index.html ]; then
            cp dist-static/index.html dist-static/404.html
          fi
          # No CNAME — site is served at misskonstruction.github.io (default Pages URL)
          rm -f dist-static/CNAME
          touch dist-static/.nojekyll
          test -s dist-static/index.html
          test -s dist-static/404.html
          find dist-static -type f -name '.DS_Store' -delete
          echo "dist-static files ready: $(find dist-static -type f | wc -l)"
          echo "✅ 404.html and .nojekyll are in place"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
