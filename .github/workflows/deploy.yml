name: Deploy to GitHub Pages
# Trigger redeploy: reassert CNAME + SPA 404 fallback


# Builds the TanStack Start app, prerenders every route to static HTML,
# and publishes the result to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build app
        run: |
          rm -rf dist-static
          bun run build

      - name: Add TanStack preview server compatibility shim
        run: |
          if [ ! -f dist/server/server.js ]; then
            for f in dist/server/index.js dist/server/index.mjs dist/server/server.mjs; do
              if [ -f "$f" ]; then cp "$f" dist/server/server.js; break; fi
            done
          fi

      - name: Prerender static HTML
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WORDPRESS_COM_API_KEY: ${{ secrets.WORDPRESS_COM_API_KEY }}
        run: bun run prerender

      - name: Add SPA fallback + custom domain + .nojekyll
        if: always()
        run: |
          set -e
          mkdir -p dist-static
          # If prerender bailed before copying the client build, recover it now
          if [ ! -f dist-static/index.html ]; then
            for d in .output/public dist/client dist .vinxi/build/client; do
              if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
                cp -r "$d"/. dist-static/
                break
              fi
            done
          fi
          if [ -d public ]; then cp -r public/. dist-static/; fi
          # GitHub Pages 404 fallback so deep links work
          if [ -f dist-static/index.html ]; then
            cp dist-static/index.html dist-static/404.html
          fi
          printf '%s\n' "misskonstruction.com" > dist-static/CNAME
          touch dist-static/.nojekyll
          test -s dist-static/index.html
          test -s dist-static/404.html
          test "$(cat dist-static/CNAME)" = "misskonstruction.com"
          find dist-static -type f -name '.DS_Store' -delete
          echo "dist-static files ready: $(find dist-static -type f | wc -l)"
          echo "✅ CNAME, 404.html, and .nojekyll are in place"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
