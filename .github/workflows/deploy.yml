name: Deploy to GitHub Pages
# Trigger redeploy: publish watermarked boats-01 + reverted window shimmer


# Builds the TanStack Start app, prerenders every route to static HTML,
# and publishes the result to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build app
        run: bun run build

      - name: Add TanStack preview server compatibility shim
        run: |
          if [ ! -f dist/server/server.js ] && [ -f dist/server/index.js ]; then
            cp dist/server/index.js dist/server/server.js
          fi

      - name: Prerender static HTML
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          WORDPRESS_COM_API_KEY: ${{ secrets.WORDPRESS_COM_API_KEY }}
        run: bun run prerender

      - name: Add SPA fallback + .nojekyll
        run: |
          # GitHub Pages 404 fallback so deep links work
          cp dist-static/index.html dist-static/404.html
          touch dist-static/.nojekyll

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          publish_branch: gh-pages
