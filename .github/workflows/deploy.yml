name: Deploy to GitHub Pages
# Build from source on every push, then publish the static output to gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (marketplace action)
        id: setup_bun
        # Pinned instead of `latest` so a marketplace/CDN hiccup on the
        # floating tag can't change what we run. continue-on-error lets the
        # fallback below take over when GitHub can't resolve the action.
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Setup Bun (fallback install script)
        if: steps.setup_bun.outcome != 'success'
        run: |
          set -e
          curl -fsSL --retry 5 --retry-all-errors https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify Bun is available
        run: bun --version

      - name: Install dependencies
        # Retry transient network failures before giving up on the run.
        run: |
          set -e
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile || bun install; then
              echo "✅ dependencies installed (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "❌ dependency install failed after 3 attempts"; exit 1


      - name: Neutralize stale root artifacts before build
        # Nitro auto-detects a root ./index.html and bakes it into the SSR
        # renderer template, embedding stale asset hashes from previous
        # manual syncs. Rename these out of the way so this run's build
        # generates a fresh renderer template from its own manifest.
        # ./assets/ rename is precautionary — root ./assets/ could be
        # picked up by public-dir auto-copy logic and cause similar drift.
        run: |
          set -e
          [ -f index.html ] && mv index.html index.html.ci-hidden || true
          [ -d assets ] && mv assets assets.ci-hidden || true
          if [ -f index.html ] || [ -d assets ]; then
            echo "❌ Failed to neutralize root artifacts"; exit 1
          fi
          echo "✅ Root artifacts neutralized for build"

      - name: Build client + server bundle
        run: bun run build

      - name: Restore root artifacts
        if: always()
        run: |
          [ -f index.html.ci-hidden ] && mv index.html.ci-hidden index.html || true
          [ -d assets.ci-hidden ] && mv assets.ci-hidden assets || true
          echo "✅ Root artifacts restored"



      - name: Diagnose SSR/client hash disagreement
        run: |
          set +e
          echo "── .output tree (depth 3) ──"
          find .output -maxdepth 3 -type d | sort
          echo "── .output/public/assets listing ──"
          ls .output/public/assets 2>/dev/null | sort
          echo "── every manifest.json under .output ──"
          find .output -name "manifest.json" | sort
          for f in $(find .output -name "manifest.json"); do
            echo "── $f ──"
            head -c 6000 "$f"; echo
          done

          echo "── search WHOLE checkout for the 4 stale hashes ──"
          for h in mhJp_l7G Db_OZXrz CZxY4Lzs Dad_uxzM; do
            echo "  hash $h:"
            grep -rl --exclude-dir=node_modules --exclude-dir=.git "$h" . 2>/dev/null \
              | sed 's/^/    /'
          done

          echo "── same 4 hashes, scoped to .output/server only ──"
          for h in mhJp_l7G Db_OZXrz CZxY4Lzs Dad_uxzM; do
            echo "  hash $h in .output/server:"
            grep -rl "$h" .output/server 2>/dev/null | sed 's/^/    /' \
              || echo "    (not present)"
          done

          echo "── does .output/public/assets have the OWN copy of these chunk names? ──"
          ls .output/public/assets | grep -E 'SiteLayout|arrow-right|^index-' | sort
          exit 0

      - name: Prerender static routes (strict — must succeed)
        env:
          STRICT_PRERENDER: "true"
        run: |
          set -e
          # Wipe any partial artifact from an earlier step in the same job so
          # a prior run's HTML/assets can never blend into this run's output.
          rm -rf dist-static
          bun run prerender
          test -s dist-static/index.html



      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          test -s dist-static/index.html

          # Never publish a CNAME (project lives at the default github.io URL).
          rm -f CNAME dist-static/CNAME

          # Fallback only. Journal posts are prerendered as real static pages,
          # so shared post links should not need this redirect to load.
          cat > dist-static/404.html <<'HTML'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting…</title>
          <script>
            var l = window.location;
            l.replace(
              l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
              '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
              (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
              l.hash
            );
          </script></head><body></body></html>
          HTML

          # Inject restore script into every index.html (idempotent) for the
          # fallback route only.
          python3 - <<'PY'
          import pathlib, re
          snippet = '<script id="spa-github-pages-restore">(function(l){if(l.search[1]==="/"){var d=l.search.slice(1).split("&").map(function(s){return s.replace(/~and~/g,"&")}).join("?");window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);}}(window.location))</script>'
          count = 0
          for p in pathlib.Path("dist-static").rglob("index.html"):
              html = p.read_text()
              if "spa-github-pages-restore" in html:
                  continue
              html = re.sub(r'<head([^>]*)>', r'<head\1>' + snippet, html, count=1)
              p.write_text(html)
              count += 1
          print(f"injected into {count} files")
          PY

          touch dist-static/.nojekyll
          find dist-static -type f -name '.DS_Store' -delete
          echo "✅ dist-static ready: $(find dist-static -type f | wc -l) files"

      - name: Verify every HTML asset reference resolves on disk
        # Runs on the exact bytes about to be published. Fails the job (blocks
        # publish) if any /assets/* reference in any HTML file is missing —
        # this is what prevents asset-hash-drift from ever going live.
        run: node scripts/prerender.mjs --verify-assets dist-static


      - name: Publish to gh-pages branch
        # Plain git instead of a marketplace action so a GitHub Actions CDN
        # outage ("Failed to resolve action download info") can't block a
        # deploy. Creates a single fresh orphan commit, same as force_orphan.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -s dist-static/index.html

          PUBLISH_DIR="$(mktemp -d)"
          cp -a dist-static/. "$PUBLISH_DIR"/
          cd "$PUBLISH_DIR"

          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to gh-pages"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push --force --quiet "$REMOTE" gh-pages; then
              echo "✅ published to gh-pages (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "❌ failed to push gh-pages after 3 attempts"; exit 1

      - name: Sync build into main branch root
        # GitHub Pages on this repo may be served from main/root, where an old
        # committed snapshot of the site lives. Publish the same fresh build
        # there so it can never serve stale HTML. Source folders are untouched.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          test -s dist-static/index.html

          BUILD_DIR="$(mktemp -d)"
          cp -a dist-static/. "$BUILD_DIR"/

          # Remove the previously generated site copy at the repo root.
          rm -rf assets blog gallery recipes prayers about contact
          rm -f index.html 404.html _headers .nojekyll

          # Copy the fresh build in (dist-static/ itself is gitignored-ish
          # build output and is intentionally not part of this copy target).
          cp -a "$BUILD_DIR"/. ./
          rm -rf dist-static

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️  main root already matches the build; nothing to commit"
            exit 0
          fi
          git commit -q -m "Sync built site to main root [skip ci]"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push --quiet "$REMOTE" HEAD:main; then
              echo "✅ synced build to main root (attempt $attempt)"
              exit 0
            fi
            echo "⚠️  push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "❌ failed to push main after 3 attempts"; exit 1


